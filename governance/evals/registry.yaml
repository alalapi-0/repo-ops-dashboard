schema_version: 0.1.0
updated_at: '2026-06-02T00:00:00Z'
evals:
  - eval_id: repo_protocol_exists
    description: repo_protocol_standard.yaml exists and is parseable.
    type: file_exists
    required: true
    path: repo_protocol_standard.yaml
  - eval_id: agents_md_exists
    description: AGENTS.md exists and documents agent boundaries.
    type: file_exists
    required: true
    path: AGENTS.md
  - eval_id: no_secret_exposure
    description: Tracked files do not contain obvious API keys, private keys, or tokens.
    type: static_scan
    required: true
  - eval_id: managed_repo_readonly
    description: Managed repositories are only scanned through allowlisted management files.
    type: policy_check
    required: true
  - eval_id: dashboard_html_exists
    description: dashboard/index.html exists after generation.
    type: file_exists
    required: true
    path: dashboard/index.html
  - eval_id: round_state_updated
    description: round_state/current_round.yaml reflects the completed round.
    type: yaml_check
    required: true
    path: round_state/current_round.yaml
  - eval_id: project_registry_exists
    description: governance/project_registry.yaml exists and lists registered projects.
    type: file_exists
    required: true
    path: governance/project_registry.yaml
  - eval_id: portfolio_state_exists
    description: governance/portfolio_state.yaml exists with summary and project rows.
    type: file_exists
    required: true
    path: governance/portfolio_state.yaml
  - eval_id: governance_task_queue_exists
    description: governance/governance_task_queue.yaml exists with summary and task rows.
    type: file_exists
    required: true
    path: governance/governance_task_queue.yaml
  - eval_id: proof_of_work_registry_exists
    description: governance/proof_of_work_registry.yaml exists with summary and proof rows.
    type: file_exists
    required: true
    path: governance/proof_of_work_registry.yaml
  - eval_id: agent_run_jsonl_valid
    description: governance/runs/example_run.jsonl exists and matches audit trail schema.
    type: schema_check
    required: true
    path: governance/runs/example_run.jsonl
  - eval_id: review_queue_valid
    description: governance/review_queue.yaml exists and passes HITL validation rules.
    type: schema_check
    required: true
    path: governance/review_queue.yaml
  - eval_id: execpolicy_valid
    description: governance/execpolicy/*.rules parse and include required portfolio constraints.
    type: schema_check
    required: true
    path: governance/execpolicy/portfolio.rules
  - eval_id: repo_context_index_valid
    description: repo_context_index.yaml exists at repo root and passes schema validation.
    type: schema_check
    required: true
    path: repo_context_index.yaml
  - eval_id: scan_policy_valid
    description: config/scan_policy.yaml exists and defines v2 core governance categories.
    type: schema_check
    required: true
    path: config/scan_policy.yaml
  - eval_id: analyzer_policy_valid
    description: config/analyzer_policy.yaml exists and defines v2 health dimensions.
    type: schema_check
    required: true
    path: config/analyzer_policy.yaml
  - eval_id: priority_scoring_policy_valid
    description: config/priority_scoring_policy.yaml exists and defines impact/urgency/unblock scoring.
    type: schema_check
    required: true
    path: config/priority_scoring_policy.yaml
  - eval_id: lifecycle_policy_valid
    description: config/lifecycle_policy.yaml exists with canonical lifecycle states.
    type: schema_check
    required: true
    path: config/lifecycle_policy.yaml
  - eval_id: blocker_policy_valid
    description: config/blocker_policy.yaml exists with blocker types and escalation levels.
    type: schema_check
    required: true
    path: config/blocker_policy.yaml
  - eval_id: completion_report_exists
    description: The current round completion report exists.
    type: file_exists
    required: true
    path: reports/round_39_completion_report.md
  - eval_id: task_spec_schema_valid
    description: task_spec template includes required governance fields.
    type: schema_check
    required: true
    path: governance/task_specs/task_spec.template.yaml
  - eval_id: proof_of_work_schema_valid
    description: proof_of_work template includes required completion proof fields.
    type: schema_check
    required: true
    path: governance/proof_of_work/proof_of_work.template.json
  - eval_id: ui_check_policy_valid
    description: config/ui_check_policy.yaml defines v1 Playwright dashboard validation checks.
    type: schema_check
    required: true
    path: config/ui_check_policy.yaml
  - eval_id: playwright_dashboard_check
    description: Playwright validates local dashboard rendering, console, and network when available.
    type: ui_check
    required: false
    command: python3 scripts/ui_check.py --file dashboard/index.html --screenshot reports/ui_screenshots/dashboard.png --headless true
